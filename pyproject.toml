[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-cost-audit"
version = "0.1.0"
description = "Read LLM call logs and report where the money goes, with explainable saving estimates."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
llm-cost-audit = "llm_cost_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_cost_audit = ["prices.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
